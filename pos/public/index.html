<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lemon Tree POS</title>
  <meta name="theme-color" content="#2f6b35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lemon POS">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f4ec;
      --surface: #ffffff;
      --ink: #23261f;
      --muted: #6b6d62;
      --line: #e3dfcf;
      --leaf: #2f6b35;
      --leaf-ink: #ffffff;
      --lemon: #f5cf3a;
      --lemon-soft: #fdf3c4;
      --warn: #b3541e;
      --warn-soft: #fbe6d8;
      --ok-soft: #e1efdc;
      --danger: #b3261e;
      --radius: 14px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Prompt", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      font-variant-numeric: tabular-nums;
      overscroll-behavior: none;
    }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--lemon); outline-offset: 2px; }
    [hidden] { display: none !important; }

    /* ---------- PIN ---------- */
    .login {
      min-height: 100%;
      display: grid; place-items: center;
      padding: calc(24px + var(--safe-top)) 16px calc(24px + var(--safe-bottom));
      background: var(--leaf);
      color: var(--leaf-ink);
    }
    .login-box { width: 100%; max-width: 320px; text-align: center; }
    .login h1 { margin: 12px 0 4px; font-size: 24px; }
    .login p { margin: 0 0 20px; opacity: .8; font-size: 14px; }
    .pin-dots { display: flex; justify-content: center; gap: 14px; margin-bottom: 8px; height: 18px; }
    .pin-dots span { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); }
    .pin-dots span.on { background: var(--lemon); border-color: var(--lemon); }
    .pin-msg { min-height: 22px; font-size: 14px; color: #ffd8c7; margin-bottom: 8px; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .keypad button {
      height: 68px; border-radius: 50px;
      background: rgba(255,255,255,.12);
      font-size: 26px; font-weight: 500; color: #fff;
    }
    .keypad button:active { background: rgba(255,255,255,.28); }
    .keypad .ghost { background: transparent; font-size: 16px; }

    /* ---------- แอป ---------- */
    .app { height: 100%; display: flex; flex-direction: column; }
    .topbar {
      display: flex; align-items: center; gap: 12px;
      padding: calc(10px + var(--safe-top)) 16px 10px;
      background: var(--leaf); color: var(--leaf-ink);
    }
    .brand { font-weight: 700; font-size: 17px; white-space: nowrap; }
    .today { margin-left: auto; text-align: right; line-height: 1.2; }
    @media (max-width: 480px) {
      .brand { font-size: 15px; }
      .topbar { gap: 8px; }
      .top-btn { padding: 8px 10px; font-size: 13px; }
    }
    .today b { font-size: 18px; }
    .today small { display: block; font-size: 12px; opacity: .85; }
    .top-btn {
      padding: 8px 12px; border-radius: 10px;
      background: rgba(255,255,255,.14); color: #fff; font-size: 14px; white-space: nowrap;
    }
    .queue-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
      background: var(--warn-soft); color: var(--warn);
    }

    .main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr; }
    @media (min-width: 820px) { .main { grid-template-columns: 1fr 360px; } }

    .catalog { min-height: 0; overflow-y: auto; padding: 12px 16px 120px; }
    @media (min-width: 820px) { .catalog { padding-bottom: 24px; } }
    .cats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
    .cats::-webkit-scrollbar { display: none; }
    .cats button {
      flex: 0 0 auto; padding: 8px 16px; border-radius: 999px;
      background: var(--surface); border: 1px solid var(--line); font-size: 15px;
    }
    .cats button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .tile {
      position: relative;
      display: flex; flex-direction: column; align-items: flex-start; gap: 4px;
      min-height: 112px; padding: 12px;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      text-align: left; transition: transform .06s;
    }
    .tile:active { transform: scale(.97); background: var(--lemon-soft); }
    .tile .emoji { font-size: 30px; line-height: 1; }
    .tile .name { font-size: 15px; font-weight: 500; line-height: 1.3; }
    .tile .price { margin-top: auto; font-weight: 600; color: var(--leaf); }
    .tile .count {
      position: absolute; top: 8px; right: 8px;
      min-width: 26px; height: 26px; padding: 0 7px; border-radius: 13px;
      background: var(--leaf); color: #fff; font-size: 14px; font-weight: 600;
      display: grid; place-items: center;
    }

    /* ตะกร้า: คอลัมน์ขวาบนจอกว้าง / แผ่นเลื่อนขึ้นบนมือถือ */
    .cart {
      display: flex; flex-direction: column; min-height: 0;
      background: var(--surface); border-left: 1px solid var(--line);
    }
    .cart-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
    .cart-head h2 { margin: 0; font-size: 18px; }
    .link-btn { color: var(--muted); font-size: 14px; padding: 6px; }
    .lines { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px; }
    .empty { color: var(--muted); text-align: center; padding: 32px 0; font-size: 14px; }
    .line { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .line .info { flex: 1; min-width: 0; }
    .line .info div { font-size: 15px; }
    .line .info small { color: var(--muted); }
    .stepper { display: flex; align-items: center; gap: 4px; }
    .stepper button { width: 36px; height: 36px; border-radius: 10px; background: var(--bg); font-size: 20px; }
    .stepper span { min-width: 26px; text-align: center; font-weight: 600; }
    .line .sum { width: 64px; text-align: right; font-weight: 600; }
    .cart-foot { padding: 12px 16px calc(14px + var(--safe-bottom)); border-top: 1px solid var(--line); display: grid; gap: 10px; }
    .note {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--bg); font: inherit; font-size: 15px; color: var(--ink);
    }
    .total-row { display: flex; justify-content: space-between; align-items: baseline; }
    .total-row b { font-size: 26px; }
    .pay {
      height: 56px; border-radius: 14px;
      background: var(--leaf); color: #fff; font-size: 18px; font-weight: 600;
    }
    .pay:disabled { opacity: .4; cursor: default; }

    .cartbar {
      position: fixed; left: 12px; right: 12px; bottom: calc(12px + var(--safe-bottom));
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-radius: 16px;
      background: var(--ink); color: var(--bg); box-shadow: 0 8px 24px rgba(0,0,0,.18);
      font-size: 16px;
    }
    .cartbar b { margin-left: auto; font-size: 18px; }
    @media (min-width: 820px) { .cartbar { display: none !important; } }

    @media (max-width: 819.98px) {
      .cart {
        position: fixed; inset: auto 0 0 0; z-index: 20;
        max-height: 88%; border-left: 0;
        border-radius: 20px 20px 0 0; box-shadow: 0 -12px 32px rgba(0,0,0,.18);
        transform: translateY(105%); transition: transform .2s ease;
      }
      .cart.open { transform: none; }
    }
    .scrim { position: fixed; inset: 0; z-index: 15; background: rgba(0,0,0,.35); }

    /* ---------- บิลวันนี้ ---------- */
    .sheet {
      position: fixed; inset: 0; z-index: 30;
      display: flex; flex-direction: column;
      background: var(--bg);
      padding-top: var(--safe-top);
    }
    .sheet-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
    .sheet-head h2 { margin: 0; font-size: 18px; flex: 1; }
    .sheet-body { flex: 1; overflow-y: auto; padding: 12px 16px calc(24px + var(--safe-bottom)); }
    .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .summary > div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
    .summary small { color: var(--muted); display: block; }
    .summary b { font-size: 22px; }
    .bill { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; }
    .bill.void { opacity: .55; }
    .bill-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .bill-top b { font-size: 16px; }
    .bill-top .amt { margin-left: auto; font-weight: 600; }
    .bill-items { color: var(--muted); font-size: 14px; margin: 6px 0; }
    .chip { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
    .chip.synced { background: var(--ok-soft); color: var(--leaf); }
    .chip.pending { background: var(--warn-soft); color: var(--warn); }
    .chip.local { background: var(--lemon-soft); color: #7a5d00; }
    .chip.void { background: #eee; color: #555; }
    .void-btn { font-size: 13px; color: var(--danger); padding: 6px 0; }
    .void-btn.confirm { font-weight: 700; }

    /* ---------- สรุปยอด ---------- */
    .seg { display: flex; gap: 4px; padding: 4px; margin-bottom: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
    .seg button { flex: 1; padding: 10px 0; border-radius: 9px; font-size: 15px; color: var(--muted); }
    .seg button.on { background: var(--leaf); color: #fff; font-weight: 600; }
    .range-label { color: var(--muted); font-size: 13px; margin: -4px 0 12px; }
    .delta { font-size: 13px; font-weight: 600; margin-top: 2px; }
    .delta.up { color: var(--leaf); }
    .delta.down { color: var(--warn); }
    .delta.flat { color: var(--muted); font-weight: 500; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
    .panel h3 { margin: 0 0 10px; font-size: 16px; }
    .panel .hint { color: var(--muted); font-size: 13px; margin: -6px 0 10px; }
    .bars { display: grid; gap: 8px; }
    .bar-row { display: grid; grid-template-columns: minmax(84px, 38%) 1fr auto; align-items: center; gap: 10px; font-size: 14px; }
    .bar-row .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { display: block; height: 12px; border-radius: 6px; background: var(--bg); overflow: hidden; }
    .bar-fill { display: block; height: 100%; min-width: 4px; border-radius: 6px; background: var(--leaf); }
    .bar-row.top .bar-fill { background: var(--lemon); }
    .bar-row .val { text-align: right; white-space: nowrap; }
    .bar-row .val small { color: var(--muted); display: block; font-size: 12px; }
    .day-list { display: grid; gap: 6px; font-size: 14px; }
    .day-list div { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); }
    .day-list span { color: var(--muted); }

    .toast {
      position: fixed; left: 50%; top: calc(16px + var(--safe-top)); z-index: 50;
      transform: translateX(-50%);
      max-width: calc(100% - 32px);
      padding: 12px 18px; border-radius: 12px;
      background: var(--ink); color: var(--bg); font-size: 15px;
      box-shadow: 0 8px 24px rgba(0,0,0,.2);
    }
    .toast.warn { background: var(--warn); color: #fff; }

    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <!-- หน้าใส่ PIN -->
  <section class="login" id="login" hidden>
    <div class="login-box">
      <div style="font-size:44px">🍋</div>
      <h1>Lemon Tree House</h1>
      <p>ใส่ PIN ของร้านเพื่อเริ่มขาย</p>
      <div class="pin-dots" id="pinDots"></div>
      <div class="pin-msg" id="pinMsg"></div>
      <div class="keypad" id="keypad"></div>
    </div>
  </section>

  <!-- หน้าขาย -->
  <div class="app" id="app" hidden>
    <header class="topbar">
      <div class="brand">🍋 Lemon POS</div>
      <span class="queue-pill" id="queuePill" hidden></span>
      <div class="today"><b id="todayTotal">฿0</b><small id="todayBills">วันนี้ 0 บิล</small></div>
      <button class="top-btn" id="openSummary">สรุปยอด</button>
      <button class="top-btn" id="openBills">บิลวันนี้</button>
    </header>

    <div class="main">
      <section class="catalog">
        <div class="cats" id="cats"></div>
        <div class="grid" id="grid"></div>
      </section>

      <aside class="cart" id="cart" aria-label="ตะกร้า">
        <div class="cart-head">
          <h2>บิลนี้</h2>
          <button class="link-btn" id="clearCart">ล้าง</button>
        </div>
        <div class="lines" id="lines"></div>
        <div class="cart-foot">
          <input class="note" id="note" maxlength="200" placeholder="หมายเหตุ (ถ้ามี) เช่น หวานน้อย, มีโปร">
          <div class="total-row"><span>รวม</span><b id="cartTotal">฿0</b></div>
          <button class="pay" id="pay" disabled>จบบิล</button>
        </div>
      </aside>
    </div>

    <button class="cartbar" id="cartbar" hidden>
      <span id="cartbarCount"></span><b id="cartbarTotal"></b>
    </button>
    <div class="scrim" id="scrim" hidden></div>
  </div>

  <!-- บิลวันนี้ -->
  <section class="sheet" id="bills" hidden>
    <div class="sheet-head">
      <h2>บิลวันนี้</h2>
      <button class="top-btn" style="background:var(--bg);color:var(--ink)" id="closeBills">ปิด</button>
    </div>
    <div class="sheet-body" id="billsBody"></div>
  </section>

  <!-- สรุปยอด -->
  <section class="sheet" id="summary" hidden>
    <div class="sheet-head">
      <h2>สรุปยอด</h2>
      <button class="top-btn" style="background:var(--bg);color:var(--ink)" id="closeSummary">ปิด</button>
    </div>
    <div class="sheet-body">
      <div class="seg" id="rangeSeg">
        <button data-range="today" class="on">วันนี้</button>
        <button data-range="week">สัปดาห์นี้</button>
        <button data-range="month">เดือนนี้</button>
      </div>
      <div id="summaryBody"><p class="empty">กำลังโหลด…</p></div>
    </div>
  </section>

  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
